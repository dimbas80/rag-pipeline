<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>interface_RAG</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><button data-tab="chat">Чат</button><button data-tab="documents">Добавить документ</button><button data-tab="settings">Настройки</button></nav><main><section id="chat"><h1>Чат</h1><textarea id="query" placeholder="Введите вопрос"></textarea><button id="ask">Спросить</button><pre id="answer"></pre></section><section id="documents" hidden><h1>Добавить документ</h1><input id="file" type="file"><button id="upload">Загрузить</button><pre id="doc-status"></pre><button id="register" disabled>Зарегистрировать документ</button><button id="convert" disabled>Конвертировать</button><button id="index" disabled>Добавить в базу</button><button id="stop">Стоп</button><pre id="job-log"></pre></section><section id="settings" hidden><h1>Настройки</h1><div id="settings-panel"><h2>Провайдеры и роли</h2><button id="settings-refresh">Обновить</button><button id="add-provider">Добавить провайдера</button><div><label>Chat <select id="chat-model"></select></label><select id="chat-fallback"></select><button id="save-chat-model">Сохранить</button></div><div><label>Vision <select id="vision-model"></select></label><select id="vision-fallback"></select><button id="save-vision-model">Сохранить</button></div><div><label>Embedding <select id="embedding-model"></select></label><select id="embedding-fallback"></select><button id="save-embedding-model">Сохранить</button></div><div><label>Rerank <select id="rerank-model"></select></label><select id="rerank-fallback"></select><button id="save-rerank-model">Сохранить</button></div><pre id="providers-view"></pre><h2>.env</h2><pre id="env-view"></pre><textarea id="env-values" placeholder="KEY=value"></textarea><button id="save-env">Сохранить env</button></div><dialog id="provider-dialog"><h2>Добавить провайдера</h2><label>Имя <input id="provider-name"></label><label>API key <input id="provider-key" type="password"></label><label>Base URL <input id="provider-url" placeholder="https://service.example/v1"></label><pre id="provider-scan-result"></pre><button id="provider-test">Тест</button><button id="provider-add" disabled>Добавить</button><button id="provider-cancel">Отмена</button></dialog></section></main><script src="/static/app.js"></script></body></html>
