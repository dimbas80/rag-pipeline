# ═══════════════════════════════════════════════════════════════════════════
# Конфигурация RAG-индексации нормативных документов v2 (ADR-010)
# Спецификация: docs/software/rag_config_spec.yaml
# Изменения v2: max_chunk_tokens (Qwen3 tokenizer), status/status_reason,
#               replaced_by_document_id (официальный номер документа-преемника)
# ═══════════════════════════════════════════════════════════════════════════

defaults:
  output_format: "jsonl"               # jsonl (построчно)
  max_chunk_tokens: 7000               # макс. размер чанка в токенах Qwen3
  tokenizer: "Qwen/Qwen3-Embedding-8B" # HF model id для transformers.AutoTokenizer
  tokenizer_revision: "main"           # фиксированная ревизия токенизатора
  allow_degraded_fallback: false       # запретить молчаливый chars/token fallback
  tokenizer_fallback_ratio: 3.5        # chars/token (только при allow_degraded_fallback: true)
  include_tables: true                 # таблицы — в text как Markdown
  include_images: true                 # ![fig_N](image/fig_N.jpg) — как есть
  extract_references: true             # авто regexp: «см. п.», «табл.», «гл.»
  default_status: "active"             # статус по умолчанию если не указан

# ── Паттерны references ──
references:
  patterns:
    - 'см\.\s*(?:п\.|пункт)\s*(\d+(?:\.\d+)*)'
    - '(?:согласно|по)\s+(?:п\.|пункту)\s*(\d+(?:\.\d+)*)'
    - '(?:табл\.|таблица)\s*(\d+(?:\.\d+)*)'
    - 'разд\.\s*(\d+(?:\.\d+)*)'
    - '(?:гл\.|глава)\s*(\d+(?:\.\d+)*)'

