# ═══════════════════════════════════════════════════════════════════════
# Конфигурация LLM-провайдеров и параметров узлов графа.
# Используется: qa_graph.py, telegram_bot/bot.py.
#
# Можно добавить любого OpenAI-совместимого провайдера в секцию providers.
# Ключи API читаются из .env по имени, указанному в api_key_env.
# ═══════════════════════════════════════════════════════════════════════

# ── Провайдер и модель по умолчанию ─────────────────────────────────────
# Используются, если не заданы явные переопределения (--llm-provider,
# --llm-model) или поля QAGraphConfig.llm_provider / .llm_model.

default_provider: deepseek
# Провайдер LLM-чата по умолчанию. Должен совпадать с ключом в секции providers.

default_model: deepseek-v4-flash
# Модель по умолчанию. Должна быть в списке models выбранного провайдера.

# ── Провайдеры ───────────────────────────────────────────────────────────
# Каждый провайдер — OpenAI-совместимый API. Можно добавить любого:
#   new_provider:
#     base_url: https://your-api.com/v1/chat/completions
#     api_key_env: YOUR_API_KEY_ENV
#     models: [model-1, model-2]

providers:

  deepseek:
    base_url: https://api.deepseek.com/v1/chat/completions
    # URL chat completions endpoint (OpenAI-совместимый)

    api_key_env: DEEPSEEK_API_KEY
    # Имя переменной окружения (или ключа в .env), где лежит API-ключ

    models:
      - deepseek-v4-flash
      - deepseek-v4-pro

  siliconflow:
    base_url: https://api.siliconflow.com/v1/chat/completions
    # SiliconFlow — китайский API, модели Qwen и др.

    api_key_env: SILICONFLOW_API_KEY

    models:
      - Qwen/Qwen3.5-35B-A3B
      - Qwen/Qwen3-32B

# ── Параметры узлов графа ────────────────────────────────────────────────
# Для каждого узла LangGraph задаются температура и максимальное число токенов.
# Эти параметры передаются в LLM API при вызове узла.
#
# ── Общие параметры ──
# temperature (температура):
#   Допустимый диапазон: 0.0 — 2.0
#   Влияет на: вариативность/креативность ответа LLM.
#     0.0 = строго детерминированный вывод — одинаковый запрос → одинаковый ответ
#     0.1–0.3 = небольшая вариативность — подходит для переформулировок и уточнений
#     0.5–0.7 = заметная вариативность — разные формулировки, синонимы
#     0.8–2.0 = высокая креативность — НЕ рекомендуется для нормативных документов
#
# max_tokens (максимальное число токенов в ответе):
#   Допустимый диапазон: 1 — зависит от модели (обычно до 8192)
#   Влияет на: максимальную длину ответа.
#     Мало (<256) — ответ оборвётся на полуслове, не хватит на цитаты
#     Средне (256–1024) — короткий ответ, хватит на 1-2 цитаты
#     Много (1024–4096) — развёрнутый ответ с несколькими цитатами, формулами
#     Очень много (>4096) — избыточно для QA, дороже и медленнее

nodes:

  analyze_query:
    # Узел: классификация запроса (конкретный/абстрактный).
    # Возвращает JSON {is_concrete, key_terms, suggested_clarification}.
    temperature: 0.0    # детерминированно — классификация должна быть стабильной
    max_tokens: 256      # JSON-ответ короткий, 256 достаточно

  reformulate_query:
    # Узел: переформулировка запроса при плохих результатах поиска.
    # Возвращает одну строку — новый запрос.
    temperature: 0.3    # небольшая вариативность для разных синонимов/формулировок
    max_tokens: 256      # одна строка, 256 хватает

  ask_clarification:
    # Узел: генерация уточняющих вопросов пользователю.
    # Возвращает JSON {questions: [строка, строка]}.
    temperature: 0.3    # вариативность вопросов при повторных уточнениях
    max_tokens: 512      # 1-2 вопроса с пояснением

  generate_answer:
    # Узел: генерация финального ответа с цитатами.
    # Самый важный узел — получает до 6 чанков контекста.
    temperature: 0.0    # детерминированно — нормативные ответы должны быть точными
    max_tokens: 2048     # развёрнутый ответ с цитатами, формулами, перечислением пунктов
