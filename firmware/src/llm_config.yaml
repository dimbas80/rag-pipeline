# Конфигурация LLM-провайдеров для qa_graph.py
# Можно добавить любого OpenAI-совместимого провайдера.

default_provider: deepseek
default_model: deepseek-v4-flash

providers:
  deepseek:
    base_url: https://api.deepseek.com/v1/chat/completions
    api_key_env: DEEPSEEK_API_KEY
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro

  siliconflow:
    base_url: https://api.siliconflow.com/v1/chat/completions
    api_key_env: SILICONFLOW_API_KEY
    models:
      - Qwen/Qwen3.5-35B-A3B
      - Qwen/Qwen3-32B

# Параметры по узлам графа
nodes:
  analyze_query:
    temperature: 0.0
    max_tokens: 256
  reformulate_query:
    temperature: 0.3
    max_tokens: 256
  ask_clarification:
    temperature: 0.3
    max_tokens: 512
  generate_answer:
    temperature: 0.0
    max_tokens: 2048
