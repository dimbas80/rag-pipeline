# ═══════════════════════════════════════════════════════════════════════════
# Конфигурация AI для pipeline.py
# ═══════════════════════════════════════════════════════════════════════════

table_vision:
  # Провайдер для vision-распознавания таблиц (--ai-table)
  provider: provod
  model: glm-4.5v
  api_key_env: PROVOD_API_KEY
  base_url: https://api.provod.ai/v1

  # Резервный провайдер для vision-распознавания
  fallback:
    #provider: anymodel
    #model: gc/gemini-2.5-flash
    #api_key_env: ANYMODEL_API_KEY
    #base_url: https://anymodel.org/v1
    provider: deepseek
    model: deepseek-v4-flash-vision-exp
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1

  # Промпт для vision-модели (картинка + промпт)
  prompt: |
    Переведи данную таблицу в markdown формат.
      Многоуровневый заголовок сведи в ОДНУ строку-шапку, сохраняя количество колонок
      таблицы: каждая колонка остаётся отдельным столбцом, а её заголовок собери из
      всех уровней шапки, соединив части через " — "
      (пример: "Допустимые токовые нагрузки кабелей, А — одножильных — на постоянном
      токе — на воздухе"). Пустые части пропускай.
      Общий текст, повторяющийся в нескольких колонках (например "Допустимые токовые
      нагрузки кабелей, А"), вставляй в составное имя каждой колонки.
      Если в первом столбце есть цифровой ряд по порядку отделенный от данных в этой
      же строке — это номер строки, выведи в отдельную колонку.
      Определи имя таблицы над таблицей.
      Выдай только markdown без комментариев
    

  
# API-ключи задаются через .env (DEEPSEEK_API_KEY, ANYMODEL_API_KEY).
# Порядок загрузки: .env → переменные окружения.
#
# ═══════════════════════════════════════════════════════════════════════════

ai_postprocess:
  # Провайдер по умолчанию: deepseek или provod
  provider: deepseek
  model: deepseek-v4-pro
  # Имя переменной окружения с API-ключом
  api_key_env: DEEPSEEK_API_KEY
  #Базовый URL API (OpenAI-совместимый)
  base_url: https://api.deepseek.com/v1
  #provider: provod
  #model: google/gemini-2.5-flash
  #api_key_env: PROVOD_API_KEY
  #base_url: https://api.provod.ai/v1

  # Резервный провайдер (если primary не отвечает или ключ не задан)
  fallback:
    provider: anymodel
    model: glm/glm-5.2
    api_key_env: ANYMODEL_API_KEY
    base_url: https://anymodel.org/v1

  # Объединённый промпт: постобработка + сверка таблиц с vision-эталоном.
  # Правила 1–13 — постобработка, 14–20 — сверка таблиц.
  prompt: |
    Ты — редактор технических текстов. Исправь Markdown, полученный из OCR-парсера PDF.

    ГЛАВНОЕ ПРАВИЛО: все таблицы должны оставаться на своих исходных местах в тексте.
    Ты редактируешь существующие таблицы in-place — сравниваешь с таблицами vision распознавания,
    исправляешь ошибки, дополняешь пустые ячейки, НО НЕ перемещаешь таблицу
    ни на одну строку. Каждая таблица остаётся между теми же абзацами,
    в том же разделе, что и в исходном файле.

    ЧТО МОЖНО ДЕЛАТЬ:
    1. LaTeX: убрать \mathtt{...}, \mathsf{...}, \mathfrak{...}, \pmb{...}, \boldsymbol{...}, \mathbf{...}
    2. LaTeX: \mathrm{...} -> \text{...}
    3. Исправить синтаксис latex формул если не корректный. В latex добавлять пробелы перед и после знака степени "^"
    4. OCR-артефакты: удалить мусор. В том числе одиночные строки из 1–3 слов ЗАГЛАВНЫМИ БУКВАМИ, расположенные между ![fig_N] и *Рис.* — это подписи с диаграмм, их нужно удалить.
    5. Пробелы внутри чисел: 0 , 4 2 9 -> 0,429
    6. Лишние фигурные скобки в LaTeX: {X} -> X
    7. LaTeX-команды в обычном тексте: убрать
    8. csv-блоки: оставить как есть
    9. Подписи под рисунками -> курсив: *текст*
    10. Примечания -> цитаты: > Примечание ...
    11. Удалить разрывы слов, кроме latex формул
    12. Удали повторяющийся номер документа и номер страницы
    13. Обработай текст, полученный после OCR. Встречаются строки, где числовое значение, относящееся к концу текстовой ячейки, по ошибке OCR оказалось перед этим текстом — на отдельной строке выше него, хотя должно идти после него.
    Правило: если строка состоит только из числа (возможно с разделителями `,` `.` и завершающим `;` или без него), а следующая строка — это текст, который логически продолжается этим числом (например, обрезанное описание строки), — перенеси число в конец этой текстовой строки, убрав его со своего места.
    Пример:
    Было:
    … 0,98;
    квартир с электрическими плитами…
    Стало:
    квартир с электрическими плитами…0,98;

    14. СВЕРКА ТАБЛИЦ С VISION-распознаванием
    Таблицы НЕЛЬЗЯ перемещать. Блок «Эталонные таблицы» содержит копии таблиц из картинок прошедших vision распознавание.
    Из двух вариантов таблиц выбери лучшую и дополни недостающими данными, если они есть из второй.
    
    НЕ создавай новые таблицы в конце документа.
    Таблицы имеют ID-маркеры вида <!-- t_pN_M --> перед названием таблицы в обоих блоках (Markdown-файл и Эталонные таблицы). 
    Сверяй таблицы с одинаковыми ID: найди в «Эталонных таблицах» таблицу с тем же ID, сравни с таблицей в Markdown-файле, исправь/дополни данные. 
    Объединенная таблица имеет несколько ID, сравнивай ее с несколькими таблицами vision распознавания с совпадающими ID. Имей ввиду что это одна таблица
    НЕ сверяй таблицы с разными ID. Сохрани все <!-- t_p... --> маркеры в итоговом Markdown.

    14.1 КОЛИЧЕСТВО КОЛОНОК И СТРОК: Удалять или добавлять строки либо колонки можно, если в строках или колонках имеются обрывки фраз или иные артефакты. Используй лучший вариант между исходной или vision таблицей. 
    Если ни один из вариантов не полон или имеет артефакты скомпилируй из двух один лучший. 
    14.2 ЗАГОЛОВКИ: Заголовок должен быть СТРОГО в одной строке. Используй лучшую структуру заголовка из исходной или vision таблицы. 
    Если заголовки в исходной таблице и vision различаются отдавай предпочтение тому где заголовок в одной строке. Дополни не достающие данные. Старайся не переписывать, не сокращать, не объединять без острой необходимости.
    14.3 ЯЧЕЙКИ: если ячейка в исходной таблице пустая, а в vision-таблице есть данные — заполни. Если данные есть в обоих источниках и различаются — предпочти vision-распознавание. Если данных нигде нет — оставь пустой.
    14.4 НЕ ВЫДУМЫВАЙ данные. Только из исходной таблицы или vision-распознавания.
    14.5 СТРОКА С РАЗДЕЛИТЕЛЯМИ (:---, :---: и т.д.) должна иметь ровно столько же столбцов, сколько строка заголовка. Структура таблицы не должна быть сломана.
    14.6 Добавь имя таблицы над таблицей из vision-распознавания, если его нет в исходном файле. Если имя таблицы есть в обоих вариантах, но отличается используй то которое лучше отражает суть таблицы. 
    У каждого имени таблицы должен быть номер таблицы, если его нет в обоих вариантах не придумывай его, оставь как есть.
    14.7 В ячейках таблиц LaTeX: оборачивай в $...$ только уже существующие LaTeX-выражения. Обычные Unicode-символы ≥, ≤, °, × не конвертируй в LaTeX и оставляй как есть. Единственный допустимый inline-делимитер — $...$; \(...\) не используй.
    Таблицы в которых изменено количество строк или столбцов и внесены серьезные изменения пометь маркером <!-- WARN_N --> после ID-маркеров, где N - номер таблицы из заголовка.

    ЗАГОЛОВКИ ДОКУМЕНТА

    15. Найди все строки, выделенные жирным (**текст**), которые являются заголовками разделов. 
    Определи их по смыслу: номер главы, номер пункта (1, 3.2, 5.2.1), римская цифра (I., II.), префикс («ГЛАВА», «РАЗДЕЛ», «ПРИЛОЖЕНИЕ»). 
    Замени **жирный** на Markdown-заголовок соответствующего уровня, подраздел или подпункт могут быть не выделены **жирным**, если по смыслу это подрпздел или подпункт оформи соответствующим уровнем:

    Уровни:
    - ##  — глава, часть, приложение верхнего уровня
    - ### — раздел
    - #### — подраздел, пункт
    - ##### — подпункт

    Примеры:
    До: **1 Область применения**       → ## 1 Область применения
    До: **II. Состав разделов**         → ## II. Состав разделов
    До: **ГЛАВА 1.4.**                  → ## ГЛАВА 1.4.
    До: **5.1 Общие требования**        → ### 5.1 Общие требования
    До: **5.2.1 Требования**            → #### 5.2.1 Требования
    До: **1.4. ВЫБОР АППАРАТОВ**        → ## 1.4. ВЫБОР АППАРАТОВ
        (вторая строка после             И ПРОВОДНИКОВ...
         **ГЛАВА 1.4.**)

    16. Объедини разорванные заголовки: если номер главы и название на разных строках, каждый выделен жирным — объедини в один заголовок на одной строке.
    17. НЕ меняй текст заголовка — только заменяй **...** на #-нотацию.
    18. НЕ трогай жирный текст внутри абзацев, ячеек таблиц, подписей к рисункам — только заголовки разделов.

    ЧТО НЕЛЬЗЯ:

    - НЕ удаляй изображения: ![Рисунок N](image/fig_N.jpg)
    - НЕ меняй нумерацию разделов, формул, таблиц
    - НЕ добавляй разделители
    - НЕ перемещай таблицы — каждая таблица редактируется строго in-place. Каждая таблица должна остаться на своём исходном месте в тексте. 
    - НЕ собирай таблицы в конце документа. НЕ меняй порядок следования таблиц. Таблицы НЕЛЬЗЯ выносить из раздела, к которому они относятся.
    - НЕ переписывай заголовки своими словами
    - НЕ удаляй текст из заголовков
    - НЕ меняй форматирование чисел
    
