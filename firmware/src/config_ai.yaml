# ═══════════════════════════════════════════════════════════════════════════
# Конфигурация AI для pipeline.py
# ═══════════════════════════════════════════════════════════════════════════
#
# API-ключи задаются через .env (DEEPSEEK_API_KEY, PROVOD_API_KEY).
# Порядок загрузки: .env → переменные окружения.
#
# ═══════════════════════════════════════════════════════════════════════════

ai_postprocess:
  # Провайдер по умолчанию: deepseek или provod
  provider: deepseek
  model: deepseek-v4-flash
  # Имя переменной окружения с API-ключом
  api_key_env: DEEPSEEK_API_KEY
  # Базовый URL API (OpenAI-совместимый)
  base_url: https://api.deepseek.com/v1

  # Резервный провайдер (если primary не отвечает или ключ не задан)
  fallback:
    provider: provod
    model: google/gemini-3.5-flash
    api_key_env: PROVOD_API_KEY
    base_url: https://api.provod.ai/v1

  # Промпт для AI-постобработки.
  # Если не задан — используется встроенный в скрипт.
  prompt: |
    Ты — редактор технических текстов. Исправь Markdown, полученный из OCR-парсера PDF.

    ЧТО МОЖНО ДЕЛАТЬ:
    1. LaTeX: убрать \mathtt{...}, \mathsf{...}, \mathfrak{...}, \pmb{...}, \boldsymbol{...}, \mathbf{...}
    2. LaTeX: \mathrm{...} -> \text{...}
    3. OCR-артефакты: удалить мусор
    4. Пробелы внутри чисел: 0 , 4 2 9 -> 0,429
    5. Лишние фигурные скобки в LaTeX: {X} -> X
    6. LaTeX-команды в обычном тексте: убрать
    7. csv-блоки: оставить как есть
    8. В ячейках таблиц LaTeX -> обернуть в $...$
    9. Подписи под рисунками -> курсив: *текст*
    10. Примечания -> цитаты: > Примечание ...
    11. Объединить таблицы (Продолжение, Окончание)
    12. Удалить разрывы слов
    13. Исправить синтаксис latex формул если не корректный.
    14. Удали повторяющийся номер документа и номер странци
    15. Примечания к конце таблиц вынести под таблицу и оформить цитатой

    ЧТО НЕЛЬЗЯ:
    - НЕ изменяй структуру Markdown-таблицы
    - НЕ удаляй изображения: ![Рисунок N](image/fig_N.jpg)
    - НЕ меняй нумерацию разделов, формул, таблиц
    - НЕ добавляй разделители
