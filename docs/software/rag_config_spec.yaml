# ═══════════════════════════════════════════════════════════════
# Конфигурация RAG-индексации нормативных документов
# ═══════════════════════════════════════════════════════════════

defaults:
  output_format: "jsonl"               # jsonl (построчно)
  max_chunk_chars: 1500                # макс. размер чанка (мягкий лимит)
  include_tables: true                 # таблицы — в text как Markdown
  include_images: true                 # ![fig_N](image/fig_N.jpg) — как есть
  extract_references: true             # авто regexp: «см. п.», «табл.», «гл.»

# ── Паттерны references ──
references:
  patterns:
    - 'см\.\s*(?:п\.|пункт)\s*(\d+(?:\.\d+)*)'
    - '(?:согласно|по)\s+(?:п\.|пункту)\s*(\d+(?:\.\d+)*)'
    - '(?:табл\.|таблица)\s*(\d+(?:\.\d+)*)'
    - 'разд\.\s*(\d+(?:\.\d+)*)'
    - '(?:гл\.|глава)\s*(\d+(?:\.\d+)*)'

# ═══════════════════════════════════════════════════════════════
# КАТАЛОГ ДОКУМЕНТОВ
# ═══════════════════════════════════════════════════════════════
documents:
  # ── Пример: ПУЭ ──
  pue:
    document_id: "ПУЭ"                 # номер/обозначение
    document_id_alt: null              # доп. обозначение (СНиП → СП)
    title: "Правила устройства электроустановок"
    edition: "7"
    date_enacted: "2003-01-01"         # дата ввода в действие
    date_amended: "2022-01-01"         # дата последних изменений
    amended_by: "Приказ Минэнерго РФ № 123 от 15.12.2021"
    source_file: "pue_7.pdf"
    ignore_sections:                   # пропустить при индексации
      - "Предисловие"
      - "Содержание"
      - "Приложение"

  # ── Пример: СП 89.13330 (бывший СНиП) ──
  sp89_kotelnye:
    document_id: "СП 89.13330.2016"
    document_id_alt: "СНиП II-35-76"   # старое обозначение
    title: "Котельные установки"
    edition: "2016"
    date_enacted: "2017-06-17"
    date_amended: "2021-05-18"
    amended_by: "Приказ Минстроя РФ № 295/пр от 18.05.2021"
    source_file: "СП 89.13330.2016 Котельные установки.pdf"
    ignore_sections:
      - "Предисловие"
      - "Содержание"

  # ── Пример: СО 153-34 (Молниезащита) ──
  so153_molniezashita:
    document_id: "СО 153-34.21.122-2003"
    document_id_alt: null
    title: "Инструкция по устройству молниезащиты зданий, сооружений и промышленных коммуникаций"
    edition: "2003"
    date_enacted: "2003-06-30"
    date_amended: null
    amended_by: null
    source_file: "СО153-34_21_122-2003 Молниезащита.pdf"
    ignore_sections:
      - "Содержание"
