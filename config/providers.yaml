roles:
  create_markdown:
    table_vision:
      provider: provod
      model: glm-4.5v
      fallback: &id001
        provider: anymodel
        model: glm/glm-4.6v
    ai_postprocess:
      provider: deepseek
      model: deepseek-v4-pro
      fallback: &id002
        provider: provod
        model: deepseek-v4-pro
    registration_vision:
      provider: provod
      model: glm-4.5v
      fallback: *id001
  build_search_index:
    query_processing:
      provider: deepseek
      model: deepseek-v4-pro
      fallback: *id002
    embedding:
      provider: siliconflow
      model: Qwen/Qwen3-Embedding-8B
    rerank:
      provider: siliconflow
      model: Qwen/Qwen3-Reranker-8B
